name: Deploy static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Deliberately NOT cancel-in-progress. Cancelling a run that is already waiting
  # on Pages tears down a deployment GitHub has queued, and the replacement goes
  # to the back of the same queue - three pushes in a row that way took a wait
  # that used to be one minute past ten. Queue the next run instead; GitHub drops
  # everything but the newest of the waiting ones anyway.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install CSS toolchain
        run: npm ci

      # Must run before build_site.py, which copies app/assets into the bundle.
      - name: Build CSS
        run: npm run build:css

      - name: Build static bundle
        run: python static_site/build_site.py --output static_site/site --data static_site/data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: static_site/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # No timeout input: the action caps it at its 600000 ms default and warns
        # "timeout value is greater than the allowed maximum" for anything larger,
        # so raising it does nothing. Ten minutes is the ceiling, full stop.
        #
        # Nothing about the wait is ours. The build takes ~25s, tar 0.13s, and the
        # upload a few seconds for a ~56 MB artifact; the rest is this action polling while
        # the deployment sits in Pages' queue - `deployment_queued` start to
        # finish, it never even began. That wait went 59s -> 5m27s -> past 10m in
        # one day on a bundle that barely changed. Do not go trimming files over
        # it; on a timeout just re-run the job.
