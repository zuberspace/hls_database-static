<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hydrous Layer Silicate Database</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <meta name="build" content="__BUILD__">
  <link rel="stylesheet" href="./assets/tailwind.css?rev=__BUILD__">
  <link rel="stylesheet" href="./assets/app.css?rev=__BUILD__">
  <!-- __BUILD__ is replaced at build time with the git revision, so the query
       string identifies exactly which commit is deployed and no version has to be
       bumped by hand. It is not a library version. -->
  <!-- Everything is served from this origin: no third party sees a visitor's IP,
       and there are no extra DNS/TLS round trips. Icons are inline SVG, so Font
       Awesome is gone entirely; jQuery is the copy JSmol already ships with.
       Chart.js, its zoom plugin, jQuery and JSmol are ~189 kB gzipped together
       and only a material or table page needs them, so they are loaded on demand
       from app.js (loadChartLibs / loadJSmol) instead of on every route. -->
</head>
<body class="bg-gray-300 font-sans leading-normal tracking-normal overflow-y-scroll">
  <nav class="bg-gray-800 flex items-center justify-between flex-wrap lg:pt-0 px-2 fixed w-full top-0 z-30 shadow">
    <div class="flex items-center flex-shrink-0 text-gray-700 mr-6">
      <a class="focus:outline-none" href="#/">
        <span class="text-gray-200 text-2xl pl-2"><svg viewBox="0 0 16 16" class="inline-block w-6 h-6 mr-3 align-[-0.2em] text-blue-400" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="8" cy="4" rx="5.5" ry="2.2"/><path d="M2.5 4v8c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2V4"/><path d="M2.5 8.2c0 1.2 2.5 2.2 5.5 2.2s5.5-1 5.5-2.2"/></svg> Hydrous Layer Silicates</span>
      </a>
    </div>

    <div class="block lg:hidden">
      <button id="nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="nav-content" class="flex items-center px-3 py-2 border rounded text-gray-500 border-gray-600 hover:text-gray-200 hover:border-gray-200 appearance-none focus:outline-none">
        <svg class="fill-current h-3 w-3" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
          <title>Menu</title>
          <path d="M0 3h20v2H0V3zm0 6h20v2H0V9zm0 6h20v2H0v-2z" />
        </svg>
      </button>
    </div>

    <div id="nav-content" class="w-full flex-grow lg:flex lg:items-center lg:w-auto hidden lg:block py-2 lg:py-0 z-10 border-t-2 lg:border-0">
      <ul class="list-reset lg:flex justify-end flex-1 items-center">
        <li class="mr-3">
          <a data-nav="" class="w-full transition duration-500 ease-in-out inline-block focus:outline-none pb-2 pt-2 lg:pt-4 px-2 lg:px-4 lg:border-b-8 text-gray-200 border-blue-500 hover:bg-gray-700 rounded lg:rounded-none" href="#/"><span>Database</span></a>
        </li>
        <li class="mr-3">
          <a data-nav="table" class="w-full transition duration-500 ease-in-out inline-block focus:outline-none pb-2 pt-2 lg:pt-4 px-2 lg:px-4 lg:border-b-8 border-transparent text-gray-500 hover:border-gray-400 hover:bg-gray-700 rounded lg:rounded-none" href="#/table"><span>Table</span></a>
        </li>
        <li class="mr-3">
          <a data-nav="information" class="w-full transition duration-500 ease-in-out inline-block focus:outline-none pb-2 pt-2 lg:pt-4 px-2 lg:px-4 lg:border-b-8 border-transparent text-gray-500 hover:border-gray-400 hover:bg-gray-700 rounded lg:rounded-none" href="#/information"><span>Information</span></a>
        </li>
        <li class="mr-3">
          <a data-nav="references" class="w-full transition duration-500 ease-in-out inline-block focus:outline-none pb-2 pt-2 lg:pt-4 px-2 lg:px-4 lg:border-b-8 border-transparent text-gray-500 hover:border-gray-400 hover:bg-gray-700 rounded lg:rounded-none" href="#/references"><span>References</span></a>
        </li>
        <li class="mr-3">
          <a data-nav="contact" class="w-full transition duration-500 ease-in-out inline-block focus:outline-none pb-2 pt-2 lg:pt-4 px-2 lg:px-4 lg:border-b-8 border-transparent text-gray-500 hover:border-gray-400 hover:bg-gray-700 rounded lg:rounded-none" href="#/contact"><span>Contact</span></a>
        </li>
        <li class="mr-1">
          <a data-nav="howtocite" class="w-full transition duration-500 ease-in-out inline-block focus:outline-none pb-2 pt-2 lg:pt-4 px-2 lg:px-4 lg:border-b-8 border-transparent text-gray-500 hover:border-gray-400 hover:bg-gray-700 rounded lg:rounded-none" href="#/howtocite"><span>How to Cite</span></a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container mx-auto p-1 pt-3 mt-12 mb-1 md:mb-10 md:mt-16">
    <div class="md:flex md:flex-row-reverse">
      <!-- Search Sidebar -->
      <aside id="search-sidebar" class="w-full md:w-3/12 mb-1 md:ml-5">
        <button type="button" id="search-sidebar-toggle" aria-expanded="true" aria-controls="search-sidebar-content" class="w-full cursor-pointer bg-blue-400 text-gray-800 rounded-t px-4 py-1 flex justify-between items-center shadow-sm text-left">
          <h2 class="text-xl font-sans m-0 p-1">Search</h2>
          <svg viewBox="0 0 16 16" class="w-4 h-4 mr-3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4l3.1 3.1"/></svg>
        </button>
        <div id="search-sidebar-content" class="border border-t-0 border-blue-400 rounded-b bg-blue-100 px-2 py-3 shadow-sm text-sm">
          <div class="mb-3">
            <label for="search-name" class="block text-gray-700 font-bold mb-1">General</label>
            <input id="search-name" class="w-full border-2 border-gray-300 rounded-lg h-8 px-3 focus:outline-none focus:border-blue-500" type="search" placeholder="Name or related ...">
          </div>
          <div class="mb-2">
            <button onclick="document.getElementById('search-cation-container').classList.toggle('hidden')" class="flex items-center justify-between w-full py-1 font-bold text-gray-700 focus:outline-none">
              Intercalated cation <svg viewBox="0 0 16 16" class="w-3 h-3 ml-1" fill="currentColor" aria-hidden="true"><path d="M3 6l5 5 5-5z"/></svg>
            </button>
            <div id="search-cation-container" class="hidden bg-white border-2 border-gray-300 rounded-lg p-2 mt-1 filter-scroll overflow-y-auto"></div>
          </div>
          <div class="mb-2">
            <button onclick="document.getElementById('search-layer-type-container').classList.toggle('hidden')" class="flex items-center justify-between w-full py-1 font-bold text-gray-700 focus:outline-none">
              Layer type <svg viewBox="0 0 16 16" class="w-3 h-3 ml-1" fill="currentColor" aria-hidden="true"><path d="M3 6l5 5 5-5z"/></svg>
            </button>
            <div id="search-layer-type-container" class="hidden bg-white border-2 border-gray-300 rounded-lg p-2 mt-1"></div>
          </div>
          <div class="mb-2">
            <button onclick="document.getElementById('search-crystal-system-container').classList.toggle('hidden')" class="flex items-center justify-between w-full py-1 font-bold text-gray-700 focus:outline-none">
              Crystal System <svg viewBox="0 0 16 16" class="w-3 h-3 ml-1" fill="currentColor" aria-hidden="true"><path d="M3 6l5 5 5-5z"/></svg>
            </button>
            <div id="search-crystal-system-container" class="hidden bg-white border-2 border-gray-300 rounded-lg p-2 mt-1"></div>
          </div>
          <div class="mb-2">
            <button onclick="document.getElementById('search-unit-cell-container').classList.toggle('hidden')" class="flex items-center justify-between w-full py-1 font-bold text-gray-700 focus:outline-none">
              Unit Cell <svg viewBox="0 0 16 16" class="w-3 h-3 ml-1" fill="currentColor" aria-hidden="true"><path d="M3 6l5 5 5-5z"/></svg>
            </button>
            <div id="search-unit-cell-container" class="hidden mt-1 space-y-2">
              <div class="flex items-center space-x-1">
                <input id="search-a-min" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="a min / Å">
                <input id="search-a-max" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="a max / Å">
              </div>
              <div class="flex items-center space-x-1">
                <input id="search-b-min" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="b min / Å">
                <input id="search-b-max" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="b max / Å">
              </div>
              <div class="flex items-center space-x-1">
                <input id="search-c-min" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="c min / Å">
                <input id="search-c-max" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="c max / Å">
              </div>
            </div>
          </div>
          <div class="mb-3">
            <button onclick="document.getElementById('search-peaks-container').classList.toggle('hidden')" class="flex items-center justify-between w-full py-1 font-bold text-gray-700 focus:outline-none">
              Peaks <svg viewBox="0 0 16 16" class="w-3 h-3 ml-1" fill="currentColor" aria-hidden="true"><path d="M3 6l5 5 5-5z"/></svg>
            </button>
            <div id="search-peaks-container" class="hidden mt-1 space-y-2">
              <div class="flex items-center space-x-1"><input id="search-p1-min" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 1 min / 2θ"><input id="search-p1-max" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 1 max / 2θ"></div>
              <div class="flex items-center space-x-1"><input id="search-p2-min" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 2 min / 2θ"><input id="search-p2-max" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 2 max / 2θ"></div>
              <div class="flex items-center space-x-1"><input id="search-p3-min" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 3 min / 2θ"><input id="search-p3-max" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 3 max / 2θ"></div>
              <div class="flex items-center space-x-1"><input id="search-p4-min" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 4 min / 2θ"><input id="search-p4-max" type="number" step="0.1" class="w-1/2 border-2 border-gray-300 rounded-lg input-sm px-2 text-xs" placeholder="peak 4 max / 2θ"></div>
            </div>
          </div>
          <button id="search-reset" class="w-full bg-white hover:bg-gray-100 text-gray-800 font-semibold py-1 px-4 border border-gray-400 rounded shadow text-sm">Reset</button>
        </div>
      </aside>

      <!-- Main Content -->
      <section id="app" class="w-full md:w-9/12"></section>
    </div>
  </main>

  <footer class="container mx-auto px-4 pb-8 text-xs text-gray-500 text-center">
    <div id="build-info" class="mt-1 text-gray-400"></div>
  </footer>

  <script type="module" src="./assets/app.js?rev=__BUILD__"></script>
  <script>
    document.getElementById('nav-toggle').onclick = function() {
      var open = document.getElementById('nav-content').classList.toggle('hidden') === false;
      this.setAttribute('aria-expanded', String(open));
    }
    document.getElementById('search-sidebar-toggle').onclick = function() {
      var open = document.getElementById('search-sidebar-content').classList.toggle('hidden') === false;
      this.setAttribute('aria-expanded', String(open));
    }
  </script>
</body>
</html>
